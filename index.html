<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro Forte - Futuro Sustentável</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Agro Forte 🌱</h1>
    <p>Futuro Sustentável: Produção e Meio Ambiente</p>
  </header>

  <section id="about">
    <h2>Sobre</h2>
    <p>Conteúdo sobre produção sustentável...</p>
  </section>

  <section id="initiatives">
    <h2>Iniciativas</h2>
    <div id="info-box">Clique em uma iniciativa para saber mais.</div>
  </section>

  <section id="contact">
    <h2>Contato</h2>
    <form id="contactForm">
      <input type="text" placeholder="Nome" required>
      <input type="email" placeholder="Email" required>
      <textarea placeholder="Mensagem" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>

  <footer>
    <p>© 2026 Agro Forte</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
